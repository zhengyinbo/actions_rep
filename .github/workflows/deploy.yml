name: Build and Deploy Spring Boot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Check jar
        run: test -f target/personal-website-backend.jar

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
      
          printf '%s' "$SSH_PRIVATE_KEY_B64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > ~/.ssh/deploy_key
      
          chmod 600 ~/.ssh/deploy_key
      
          # 必须保留：在上传前确认私钥确实有效
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
      
          ssh-keyscan \
            -p "$SERVER_PORT" \
            "$SERVER_HOST" \
            >> ~/.ssh/known_hosts
      
          chmod 600 ~/.ssh/known_hosts
            
      - name: Upload jar
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/deploy_key \
            -P "$SERVER_PORT" \
             target/personal-website-backend.jar \
             "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/personal-website-backend.jar.new" 
      - name: Deploy application
        env:
          SERVER_SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY_B64 }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_SSH_KEY_B64" \
            "mv '$SERVER_PATH/personal-website-backend.jar.new' \
              '$SERVER_PATH/personal-website-backend.jar' && \
              '$SERVER_PATH/deploy.sh'"
